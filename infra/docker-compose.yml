services:
  mysql:
    image: mysql:8.0
    container_name: clicksafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clicksafe_db}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: clicksafe-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # interfaz web
      - "127.0.0.1:1025:1025" # SMTP

volumes:
  mysql_data:
