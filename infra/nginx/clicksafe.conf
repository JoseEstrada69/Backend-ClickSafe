# Nginx como proxy inverso de ClickSafe (docs/despliegue.md). Corre en la
# MISMA PC que la API; la API escucha solo en 127.0.0.1 (nunca expuesta
# directo a la red, src/main.ts) — Nginx es el único punto de entrada.
#
# Copiar a /etc/nginx/sites-available/clicksafe.conf y enlazar en
# /etc/nginx/sites-enabled/. Reemplazar CLICKSAFE_SERVER_NAME por el
# nombre/IP real de la PC del backend en el laboratorio.

# Oculta la versión de Nginx en errores y en el header Server (defensa en
# profundidad: menos información gratis para quien escanea con nmap/ZAP).
server_tokens off;

# --- HTTP: solo redirige a HTTPS, nunca sirve contenido en claro ---
server {
    listen 80;
    listen [::]:80;
    server_name CLICKSAFE_SERVER_NAME;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy real hacia la API (127.0.0.1:3000) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name CLICKSAFE_SERVER_NAME;

    # Certificado propio del laboratorio (infra/pki/generate-ca.sh).
    ssl_certificate     /etc/nginx/ssl/clicksafe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/clicksafe/clicksafe.key;

    # TLS 1.2+ únicamente (ASVS: nunca SSLv3/TLS 1.0/1.1).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ClickSafeSSL:10m;
    ssl_session_tickets off;

    # 5 evidencias x 5 MB + margen para el resto del multipart (sección 6).
    client_max_body_size 30M;

    # Headers de seguridad a nivel de borde (además de los que ya manda
    # helmet desde la propia API — defensa en profundidad, nunca de más).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # La API necesita la IP real del cliente para el rate limiting por
        # IP (4.4) — por eso TRUST_PROXY=true en api/.env solo tiene sentido
        # con Nginx configurado así, nunca al revés.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
