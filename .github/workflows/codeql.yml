name: "CodeQL"

# Análisis estático (sección de la Fase 7 / punto 9 de CLAUDE.md). Corre en
# cada push/PR a main y una vez a la semana, para detectar vulnerabilidades
# nuevas aunque no haya cambios de código (p. ej. una regla nueva de CodeQL).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
