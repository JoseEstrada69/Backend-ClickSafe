name: CI

# Typecheck + lint + test + build + audit de dependencias en cada PR hacia
# main (sección 9/Fase 7 de MANUAL.md). No corre test:e2e aquí: necesita una
# base MySQL real (clicksafe_test) que este workflow no monta; e2e sigue
# corriendo en local antes de cada PR.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit de dependencias (solo severidad alta/crítica)
        run: npm audit --audit-level=high
